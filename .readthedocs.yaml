# Read the Docs configuration file.
# See https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  apt_packages:
    - git-lfs
    - pandoc
  jobs:
    pre_build:
      - git lfs install
      - git lfs pull

sphinx:
  configuration: docs/source/conf.py
  builder: html
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
