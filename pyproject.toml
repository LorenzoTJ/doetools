[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doetools"
dynamic = ["version"]
description = "Design of Experiments Python library"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Lorenzo Teja" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "design of experiments",
  "doe",
  "chemometrics",
  "response surface methodology",
  "mixture design",
  "d-optimal",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "plotly>=6.6.0",
  "doe-toolbox>=1.3",
  "fpdf2>=2.8.7",
  "statsmodels>=0.14.6",
  "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.12",
  "twine>=6.0",
]
docs = [
  "sphinx>=8.1.3",
  "sphinx-autodoc-typehints>=3.0.1",
  "sphinxcontrib-mermaid>=2.0.1",
  "nbsphinx>=0.9.8",
  "ipython>=8.0",
  "furo>=2025.12.19",
]

[project.urls]
Homepage = "https://github.com/LorenzoTJ/doetools"
Repository = "https://github.com/LorenzoTJ/doetools"
Issues = "https://github.com/LorenzoTJ/doetools/issues"
Changelog = "https://github.com/LorenzoTJ/doetools/blob/main/CHANGELOG.md"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["doetools*"]

[tool.setuptools.dynamic]
version = { attr = "doetools.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
cache_dir = ".pytest_cache"
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
    "--basetemp=.pytest-tmp",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["doetools"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
  "docs/_build",
  "docs/source/examples",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
